<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracer — Play</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/colors_and_type.css" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" />
  <meta name="description" content="Visualise a traceroute on a live map." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracer" />
  <meta property="og:title" content="Tracer — Play" />
  <meta property="og:description" content="Visualise a traceroute on a live map." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://play.kevinprk.com/tracer/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Tracer — Play" />
  <meta name="twitter:description" content="Visualise a traceroute on a live map." />
  <script defer src="https://analytics.kevinprk.com/script.js" data-website-id="77ca44e1-e2fe-4aca-9d4a-cee8e614d713"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--kp-bg);
      color: var(--kp-fg);
      font-family: var(--kp-font-sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; background: none; border: none; color: inherit; }

    /* ── Map ───────────────────────────────────────────────────────── */
    #map {
      position: fixed; inset: 0;
      z-index: 0;
    }
    #map { background: var(--kp-bg); }
    /* Neutral MapLibre controls */
    .maplibregl-ctrl-group {
      background: var(--kp-bg) !important;
      border: 1px solid var(--kp-border);
      border-radius: var(--kp-radius-sm) !important;
      box-shadow: none !important;
    }
    .maplibregl-ctrl-group button + button { border-top-color: var(--kp-border) !important; }
    .maplibregl-ctrl-group button:hover { background: var(--kp-hover-bg) !important; }
    [data-theme="dark"] .maplibregl-ctrl-icon,
    [data-theme="dark"] .maplibregl-ctrl-attrib-button { filter: invert(1); }
    .maplibregl-ctrl-attrib {
      font-size: 9px;
      background: transparent !important;
      color: var(--kp-fg);
      opacity: 0.4;
    }
    .maplibregl-ctrl-attrib a { color: inherit !important; }

    /* ── Hop markers ───────────────────────────────────────────────── */
    .hop-marker {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--kp-fg);
      color: var(--kp-bg);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--kp-font-mono);
      font-size: 9px;
      font-weight: 700;
      border: 2px solid var(--kp-bg);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      line-height: 1;
    }
    .hop-marker.origin {
      border-radius: var(--kp-radius-sm);
      font-family: var(--kp-font-sans);
      font-size: 12px;
      font-weight: 500;
    }
    .hop-marker.focused {
      outline: 2px solid var(--kp-fg);
      outline-offset: 2px;
    }

    .hop-popup .maplibregl-popup-content {
      font-family: var(--kp-font-mono);
      font-size: 11px;
      background: var(--kp-fg);
      color: var(--kp-bg);
      border-radius: var(--kp-radius-sm);
      box-shadow: none;
      padding: 4px 8px;
      white-space: pre;
    }
    .hop-popup .maplibregl-popup-tip { display: none; }

    /* ── Overlay top ───────────────────────────────────────────────── */
    .overlay-top {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex; align-items: center; gap: var(--kp-space-3);
      padding: 0 20px;
      height: 54px;
      background: color-mix(in srgb, var(--kp-bg) 90%, transparent);
      border-bottom: 1px solid var(--kp-border-faint);
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
      font-size: var(--kp-text-md);
      font-weight: var(--kp-weight-semi);
      letter-spacing: var(--kp-tracking-snug);
      flex-shrink: 0;
    }
    .pi-mark {
      width: 24px; height: 24px;
      border-radius: var(--kp-radius-sm);
      background: var(--kp-fg); color: var(--kp-bg);
      display: grid; place-items: center;
      font-size: 14px; font-weight: 500;
      flex-shrink: 0;
    }

    .target-input {
      flex: 1;
      max-width: 280px;
      height: 32px;
      padding: 0 10px;
      font-family: var(--kp-font-mono);
      font-size: var(--kp-text-sm);
      background: var(--kp-bg);
      color: var(--kp-fg);
      border: 1px solid var(--kp-border);
      border-radius: var(--kp-radius-sm);
      outline: none;
      transition: border-color var(--kp-dur-fast) var(--kp-ease);
    }
    .target-input:focus { border-color: var(--kp-fg-3); }
    .target-input::placeholder { color: var(--kp-fg-3); }

    .run-btn {
      height: 32px;
      padding: 0 14px;
      font-family: var(--kp-font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--kp-border);
      border-radius: var(--kp-radius-sm);
      color: var(--kp-fg-2);
      flex-shrink: 0;
      transition: background var(--kp-dur-fast) var(--kp-ease),
                  color var(--kp-dur-fast) var(--kp-ease),
                  border-color var(--kp-dur-fast) var(--kp-ease);
    }
    .run-btn:hover:not(:disabled) { background: var(--kp-hover-bg); color: var(--kp-fg); border-color: var(--kp-fg-3); }
    .run-btn:active:not(:disabled) { background: var(--kp-press-bg); }
    .run-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .spacer { flex: 1; }

    .status-badge {
      font-family: var(--kp-font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--kp-fg-3);
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--kp-fg-3);
      flex-shrink: 0;
    }
    .status-dot.running {
      background: #4ade80;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .nav-link {
      font-size: var(--kp-text-sm);
      color: var(--kp-fg-2);
      flex-shrink: 0;
      transition: color var(--kp-dur-fast) var(--kp-ease);
    }
    .nav-link:hover { color: var(--kp-fg); }

    .theme-toggle {
      width: 32px; height: 32px;
      border-radius: var(--kp-radius-sm);
      display: grid; place-items: center;
      color: var(--kp-fg-2);
      flex-shrink: 0;
      transition: background var(--kp-dur-fast) var(--kp-ease), color var(--kp-dur-fast) var(--kp-ease);
    }
    .theme-toggle:hover { background: var(--kp-hover-bg); color: var(--kp-fg); }
    .theme-toggle svg { width: 16px; height: 16px; }

    /* ── Hop panel ─────────────────────────────────────────────────── */
    .hop-panel {
      position: fixed;
      left: 0; top: 54px; bottom: 0;
      width: 260px;
      z-index: 5;
      background: color-mix(in srgb, var(--kp-bg) 90%, transparent);
      border-right: 1px solid var(--kp-border-faint);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .hop-panel-header {
      font-family: var(--kp-font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--kp-fg-3);
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--kp-border-faint);
      display: grid;
      grid-template-columns: 20px 90px 52px 1fr;
      gap: 6px;
    }

    .hop-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--kp-border) transparent;
    }

    .hop-row {
      display: grid;
      grid-template-columns: 20px 90px 52px 1fr;
      gap: 6px;
      align-items: center;
      padding: 6px 14px;
      border-bottom: 1px solid var(--kp-border-faint);
      font-family: var(--kp-font-mono);
      font-size: 11px;
      color: var(--kp-fg);
      transition: background var(--kp-dur-fast) var(--kp-ease);
    }
    .hop-row:hover { background: var(--kp-hover-bg); }
    .hop-row.timeout { color: var(--kp-fg-3); }
    .hop-row.latest { background: var(--kp-hover-bg); }
    .hop-row.geo { cursor: pointer; }
    .hop-row.active { background: var(--kp-press-bg); }

    .hop-num { color: var(--kp-fg-3); font-size: 10px; }
    .hop-ip  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.02em; }
    .hop-rtt { color: var(--kp-fg-2); text-align: right; }
    .hop-loc { color: var(--kp-fg-3); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .hop-type {
      display: inline-block;
      font-size: 7px; letter-spacing: 0.05em;
      border: 1px solid var(--kp-border);
      border-radius: 2px;
      padding: 0 2px; margin-right: 3px;
      color: var(--kp-fg-2);
      vertical-align: middle; line-height: 1.5;
    }
    .hop-type:empty { display: none; }

    .cable-btn {
      height: 32px; padding: 0 10px;
      font-family: var(--kp-font-mono); font-size: 10px;
      letter-spacing: 0.08em; text-transform: uppercase;
      border: 1px solid var(--kp-border);
      border-radius: var(--kp-radius-sm);
      color: var(--kp-fg-3); flex-shrink: 0;
      transition: background var(--kp-dur-fast) var(--kp-ease),
                  color var(--kp-dur-fast) var(--kp-ease),
                  border-color var(--kp-dur-fast) var(--kp-ease);
    }
    .cable-btn:hover:not(:disabled) { background: var(--kp-hover-bg); color: var(--kp-fg); border-color: var(--kp-fg-3); }
    .cable-btn.active { color: var(--kp-fg); border-color: var(--kp-fg-2); }
    .cable-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .hop-empty {
      padding: 20px 14px;
      font-family: var(--kp-font-mono);
      font-size: 10px;
      color: var(--kp-fg-3);
      letter-spacing: 0.04em;
    }

    /* ── Mobile: hide hop panel, show below ────────────────────────── */
    @media (max-width: 600px) {
      .hop-panel { display: none; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="overlay-top">
    <div class="brand">
      <a href="/" class="pi-mark" aria-label="Play home">π</a>
      Tracer
    </div>

    <input class="target-input" id="targetInput" type="text"
      placeholder="8.8.8.8 or google.com"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

    <button class="run-btn" id="runBtn">Run</button>
    <button class="cable-btn" id="cableBtn">Cables</button>

    <div class="spacer"></div>

    <div class="status-badge" id="statusBadge">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>

    <a href="/" class="nav-link">Play</a>

    <button class="theme-toggle" id="themeToggle" aria-label="toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
      </svg>
    </button>
  </div>

  <div class="hop-panel">
    <div class="hop-panel-header">
      <span>#</span><span>IP</span><span style="text-align:right">RTT</span><span>Location</span>
    </div>
    <div class="hop-list" id="hopList">
      <div class="hop-empty" id="hopEmpty">Enter a target and press Run</div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <script>
    const API = 'https://play-api.kevinprk.com';

    // ── Theme ──────────────────────────────────────────────────────
    const html      = document.documentElement;
    const themeBtn  = document.getElementById('themeToggle');
    const SUN  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1.06 1.06M17.34 17.34l1.06 1.06M5.6 18.4l1.06-1.06M17.34 6.66l1.06-1.06"/></svg>`;
    const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>`;

    let theme = localStorage.getItem('kp-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    // ── Map ────────────────────────────────────────────────────────
    const STYLES = {
      light: 'https://tiles.openfreemap.org/styles/positron',
      dark:  'https://tiles.openfreemap.org/styles/dark',
    };
    // Base fills and water labels pinned to --kp-gray-* so the map stays pure neutral.
    const BASE = {
      light: { land: '#f4f4f4', water: '#e8e8e8', waterLabel: '#a3a3a3' },
      dark:  { land: '#171717', water: '#000000', waterLabel: '#525252' },
    };
    const LAND_LAYERS = ['park', 'landcover', 'landuse'];

    const map = new maplibregl.Map({
      container: 'map',
      style: { version: 8, sources: {}, layers: [] },
      center: [10, 20],
      zoom: 1.5,
      attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'bottom-right');

    const EMPTY = { type: 'FeatureCollection', features: [] };

    function cableColor() {
      return theme === 'dark' ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.1)';
    }

    function fgColor() {
      return getComputedStyle(html).getPropertyValue('--kp-fg').trim() || '#111';
    }

    // Load the basemap for the theme on a globe, recolour its base fills and
    // re-attach the cable + trace overlays from current state.
    function setMapStyle() {
      const base = BASE[theme];
      map.setStyle(STYLES[theme], {
        transformStyle: (_prev, next) => {
          const layers = next.layers.map(l => {
            if (l.type === 'background') return { ...l, paint: { ...l.paint, 'background-color': base.land } };
            if (l.type === 'symbol' && l['source-layer'] === 'water_name') return { ...l, paint: { ...l.paint, 'text-color': base.waterLabel } };
            if (l.type !== 'fill') return l;
            if (l['source-layer'] === 'water') return { ...l, paint: { ...l.paint, 'fill-color': base.water } };
            if (LAND_LAYERS.includes(l['source-layer'])) return { ...l, paint: { ...l.paint, 'fill-color': base.land } };
            return l;
          });
          const firstSymbol = layers.findIndex(l => l.type === 'symbol');
          const cables = {
            id: 'cables', type: 'line', source: 'cables',
            layout: { visibility: cableVisible ? 'visible' : 'none' },
            paint: { 'line-color': cableColor(), 'line-width': 0.8 },
          };
          const trace = {
            id: 'trace', type: 'line', source: 'trace',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': fgColor(), 'line-width': 1.5, 'line-opacity': 0.55 },
          };
          layers.splice(firstSymbol < 0 ? layers.length : firstSymbol, 0, cables);
          layers.push(trace);
          return {
            ...next,
            projection: { type: 'globe' },
            sources: {
              ...next.sources,
              cables: { type: 'geojson', data: cableData || EMPTY },
              trace:  { type: 'geojson', data: traceData() },
            },
            layers,
          };
        },
      });
    }

    function applyTheme(t) {
      html.setAttribute('data-theme', t);
      themeBtn.innerHTML = t === 'dark' ? SUN : MOON;
      localStorage.setItem('kp-theme', t);
      setMapStyle();
    }
    // ── Trace state ────────────────────────────────────────────────
    let evtSource     = null;
    let segments      = []; // GeoJSON LineString per hop-to-hop arc
    let hopPoints     = []; // [lat, normLon] per geolocated hop, for fitBounds
    let markers       = [];
    let markersByHop  = new Map(); // hop number → { marker, hop }
    let focusedHop    = null;
    let cableData     = null;
    let cableVisible  = true;

    function traceData() {
      return { type: 'FeatureCollection', features: segments };
    }

    function refreshTrace() {
      map.getSource('trace')?.setData(traceData());
    }

    const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'hop-popup', offset: 14 });
    const focusPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'hop-popup', offset: 14 });

    applyTheme(theme);
    themeBtn.addEventListener('click', () => { theme = theme === 'light' ? 'dark' : 'light'; applyTheme(theme); });

    function clearTrace() {
      hopPoints = [];
      markers.forEach(m => m.remove());
      markers = [];
      markersByHop.clear();
      focusedHop = null;
      hoverPopup.remove();
      focusPopup.remove();
      segments = [];
      refreshTrace();
      const hopList  = document.getElementById('hopList');
      const hopEmpty = document.getElementById('hopEmpty');
      hopList.innerHTML = '';
      hopEmpty.style.display = 'block';
      hopList.appendChild(hopEmpty);
    }

    function setActive(hopNum) {
      document.querySelectorAll('.hop-row.active').forEach(el => el.classList.remove('active'));
      const row = document.getElementById(`hop-row-${hopNum}`);
      if (row) {
        row.classList.add('active');
        row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    // Fly to a hop's marker, ring it and pin its tooltip open.
    function focusHop(hopNum) {
      const entry = markersByHop.get(hopNum);
      if (!entry) return;
      setActive(hopNum);
      document.querySelector('.hop-marker.focused')?.classList.remove('focused');
      entry.marker.getElement().classList.add('focused');
      focusedHop = hopNum;
      hoverPopup.remove();
      focusPopup.setLngLat(entry.marker.getLngLat()).setText(hopTooltip(entry.hop)).addTo(map);
      map.flyTo({
        center: entry.marker.getLngLat(),
        zoom: Math.max(map.getZoom(), 6),
        padding: { left: window.innerWidth > 600 ? 260 : 0 }, // hop panel is hidden on mobile
        duration: 1000,
      });
    }

    function fitView() {
      if (hopPoints.length < 2) return;
      const lats = hopPoints.map(ll => ll[0]);
      const lons = hopPoints.map(ll => ll[1]);
      map.fitBounds(
        [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
        { padding: { top: 60, left: 260, right: 40, bottom: 60 }, animate: false }
      );
    }

    // Compute great-circle (geodesic) intermediate points between two lat/lon pairs.
    // Normalises output longitudes to be continuous from lon1, so the arc takes
    // the short way round and stays in the same world-copy as the endpoints (no antimeridian wrap jump).
    function greatCirclePoints(lat1, lon1, lat2, lon2, n = 60) {
      const toRad = d => d * Math.PI / 180;
      const toDeg = r => r * 180 / Math.PI;
      const φ1 = toRad(lat1), λ1 = toRad(lon1);
      const φ2 = toRad(lat2), λ2 = toRad(lon2);
      const d = 2 * Math.asin(Math.sqrt(
        Math.sin((φ2 - φ1) / 2) ** 2 +
        Math.cos(φ1) * Math.cos(φ2) * Math.sin((λ2 - λ1) / 2) ** 2
      ));
      if (d < 1e-6) return [[lat1, lon1], [lat2, lon2]];
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const f = i / n;
        const A = Math.sin((1 - f) * d) / Math.sin(d);
        const B = Math.sin(f * d) / Math.sin(d);
        const x = A * Math.cos(φ1) * Math.cos(λ1) + B * Math.cos(φ2) * Math.cos(λ2);
        const y = A * Math.cos(φ1) * Math.sin(λ1) + B * Math.cos(φ2) * Math.sin(λ2);
        const z = A * Math.sin(φ1) + B * Math.sin(φ2);
        pts.push([toDeg(Math.atan2(z, Math.sqrt(x * x + y * y))), toDeg(Math.atan2(y, x))]);
      }
      while (pts[0][1] - lon1 > 180) pts[0][1] -= 360;
      while (lon1 - pts[0][1] > 180) pts[0][1] += 360;
      for (let i = 1; i < pts.length; i++) {
        while (pts[i][1] - pts[i - 1][1] > 180) pts[i][1] -= 360;
        while (pts[i - 1][1] - pts[i][1] > 180) pts[i][1] += 360;
      }
      return pts;
    }

    function hopTooltip(h) {
      const locStr = [h.city, h.country].filter(Boolean).join(', ');
      const rttStr = h.rtt ? h.rtt + ' ms' : '';
      const orgStr = h.net ? [h.net.name, h.net.info_type].filter(Boolean).join(' · ') : '';
      return `${h.origin ? 'Origin' : '#' + h.hop}  ${h.ip}\n${[locStr, rttStr].filter(Boolean).join('  ·  ')}${orgStr ? '\n' + orgStr : ''}`;
    }

    function addMarker(hop) {
      let normLon = hop.lon;
      if (hopPoints.length > 0) {
        const prevLon = hopPoints[hopPoints.length - 1][1];
        while (normLon - prevLon > 180) normLon -= 360;
        while (prevLon - normLon > 180) normLon += 360;
      }
      hop.normLon = normLon;

      const el = document.createElement('div');
      el.className = hop.origin ? 'hop-marker origin' : 'hop-marker';
      el.textContent = hop.origin ? 'π' : hop.hop;
      const m = new maplibregl.Marker({ element: el }).setLngLat([normLon, hop.lat]).addTo(map);
      el.addEventListener('mouseenter', () => {
        if (focusedHop === hop.hop) return;
        hoverPopup.setLngLat(m.getLngLat()).setText(hopTooltip(hop)).addTo(map);
      });
      el.addEventListener('mouseleave', () => hoverPopup.remove());
      el.addEventListener('click', () => focusHop(hop.hop));
      markers.push(m);
      markersByHop.set(hop.hop, { marker: m, hop });

      if (hopPoints.length > 0) {
        const prev = hopPoints[hopPoints.length - 1];
        const arcPts = greatCirclePoints(prev[0], prev[1], hop.lat, normLon);
        segments.push({
          type: 'Feature', properties: {},
          geometry: { type: 'LineString', coordinates: arcPts.map(([lat, lon]) => [lon, lat]) },
        });
        refreshTrace();
      }

      hopPoints.push([hop.lat, normLon]);

      if (hopPoints.length > 1) {
        fitView();
      } else {
        map.jumpTo({ center: [normLon, hop.lat], zoom: 4 });
      }
    }

    function addHopRow(hop) {
      document.getElementById('hopEmpty').style.display = 'none';
      const list = document.getElementById('hopList');

      // Remove "latest" from previous row
      list.querySelector('.latest')?.classList.remove('latest');

      const row = document.createElement('div');
      const hasGeo = hop.lat && hop.lon;
      row.className = `hop-row${hop.timeout ? ' timeout' : ''}${hasGeo ? ' geo' : ''} latest`;
      row.id = `hop-row-${hop.hop}`;

      const loc = [hop.city, hop.country].filter(Boolean).join(', ') || '—';
      const ip  = hop.timeout ? '*' : (hop.ip || '?');
      const rtt = hop.rtt ? hop.rtt + 'ms' : '—';

      row.innerHTML = `
        <span class="hop-num">${hop.origin ? 'π' : hop.hop}</span>
        <span class="hop-ip">${ip}</span>
        <span class="hop-rtt">${rtt}</span>
        <span class="hop-loc"><span class="hop-type" id="hop-type-${hop.hop}"></span>${loc}</span>
      `;
      if (hasGeo) {
        row.addEventListener('click', () => focusHop(hop.hop));
      }
      list.appendChild(row);
      list.scrollTop = list.scrollHeight;

      if (hop.as) {
        lookupPeeringDB(hop.as).then(net => {
          if (!net) return;
          const badge = document.getElementById(`hop-type-${hop.hop}`);
          if (badge) badge.textContent = net.info_type || '';
          hop.net = net; // picked up by hopTooltip on next hover
        });
      }
    }

    // ── Cables ─────────────────────────────────────────────────────
    const CABLE_URL = 'https://raw.githubusercontent.com/tbotnz/submarine-cables-geojson/main/cables.json';
    const cableBtn  = document.getElementById('cableBtn');
    let cablesLoading = false;

    async function loadCables() {
      if (cablesLoading) return;
      cablesLoading = true;
      cableBtn.textContent = 'Loading…';
      cableBtn.disabled = true;
      try {
        const res = await fetch(CABLE_URL);
        cableData = await res.json();
        map.getSource('cables')?.setData(cableData);
      } catch (e) {
        console.warn('cable load failed:', e);
        cableVisible = false;
        setCableVisibility();
      } finally {
        cablesLoading = false;
        cableBtn.disabled = false;
        cableBtn.textContent = 'Cables';
        cableBtn.classList.toggle('active', cableVisible);
      }
    }

    function setCableVisibility() {
      if (map.getLayer('cables')) map.setLayoutProperty('cables', 'visibility', cableVisible ? 'visible' : 'none');
    }

    cableBtn.addEventListener('click', () => {
      cableVisible = !cableVisible;
      cableBtn.classList.toggle('active', cableVisible);
      setCableVisibility();
      if (cableVisible && !cableData) loadCables();
    });

    loadCables(); // show cables on page load

    // ── PeeringDB ──────────────────────────────────────────────────
    const peeringCache = new Map();

    async function lookupPeeringDB(asField) {
      if (!asField) return null;
      const m = asField.match(/AS(\d+)/i);
      if (!m) return null;
      const asn = m[1];
      if (peeringCache.has(asn)) return peeringCache.get(asn);
      peeringCache.set(asn, null);
      try {
        const res  = await fetch(`https://www.peeringdb.com/api/net?asn=${asn}&depth=0`);
        const data = await res.json();
        const net  = data.data?.[0] ?? null;
        peeringCache.set(asn, net);
        return net;
      } catch { return null; }
    }

    // ── Status ─────────────────────────────────────────────────────
    const statusDot  = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const runBtn     = document.getElementById('runBtn');

    function setStatus(s, text) {
      statusDot.className = 'status-dot' + (s === 'running' ? ' running' : '');
      statusText.textContent = text;
      runBtn.textContent = s === 'running' ? 'Stop' : 'Run';
    }

    // ── Run / Stop ─────────────────────────────────────────────────
    const targetInput = document.getElementById('targetInput');

    function endTrace(text) {
      if (evtSource) { evtSource.close(); evtSource = null; }
      setStatus('idle', text);
    }

    function startTrace() {
      const target = targetInput.value.trim();
      if (!target) return;

      if (evtSource) { evtSource.close(); evtSource = null; }
      clearTrace();
      setStatus('running', `Tracing ${target}`);

      let hopCount = 0;
      evtSource = new EventSource(`${API}/api/tracer?target=${encodeURIComponent(target)}`);

      // The server's own location: hop 0, where the path starts.
      evtSource.addEventListener('origin', (e) => {
        const origin = { ...JSON.parse(e.data), hop: 0, origin: true };
        addHopRow(origin);
        addMarker(origin);
      });

      evtSource.onmessage = (e) => {
        const hop = JSON.parse(e.data);
        hopCount++;
        addHopRow(hop);
        if (hop.lat && hop.lon) addMarker(hop);
        statusText.textContent = `Hop ${hop.hop}…`;
      };

      evtSource.addEventListener('done', () => endTrace(`Done — ${hopCount} hops`));
      evtSource.addEventListener('error', () => endTrace('Error'));
    }

    runBtn.addEventListener('click', () => evtSource ? endTrace('Stopped') : startTrace());

    targetInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startTrace();
    });
  </script>
</body>
</html>
