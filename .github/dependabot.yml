version: 2
updates:
- package-ecosystem: gomod
  directory: /api
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
- package-ecosystem: docker
  directory: /
  schedule: &id001
    interval: monthly
  open-pull-requests-limit: 2
- package-ecosystem: docker
  directory: /api
  schedule: *id001
  open-pull-requests-limit: 2
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  ignore:
  - dependency-name: krapie/homeserver/*
