name: CI (API)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-api.yml"
      - "api/**"

jobs:
  # gate: generated from krapie/homeserver .github/workflows/app-gate.yml@aca66e03db9d4c1bae65eede076672e045cb7358 (inline: this repository is public)
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[skip gate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Go build, vet, test
      run: "set -eu\n# go version comes from each go.mod (toolchain download when newer than the runner's Go)\nfor d in api; do\n  echo \"::group::go $d\"\n  (cd \"$d\" && go build ./... && go vet ./... && go test ./...)\n  echo \"::endgroup::\"\ndone\n"
    - name: govulncheck (warn only)
      continue-on-error: true
      run: "for d in api; do\n  (cd \"$d\" && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...) || echo \"::warning::govulncheck reported findings in $d\"\ndone\n"
    - name: Trivy filesystem scan (warn only)
      continue-on-error: true
      run: 'docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.67.2 fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 0 --no-progress /src || echo "::warning::trivy could not run"

        '
  build-and-deploy:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout play repo
        uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: krapi0314/play-api:${{ env.IMAGE_TAG }}

      - name: Checkout homeserver repo
        uses: actions/checkout@v4
        with:
          repository: krapie/homeserver
          token: ${{ secrets.GITOPS_TOKEN }}
          path: homeserver

      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|krapi0314/play-api:.*|krapi0314/play-api:${{ env.IMAGE_TAG }}|" \
            homeserver/k8s/play/play-api-deployment.yaml

      - name: Commit and push manifest update
        run: |
          cd homeserver
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/play/play-api-deployment.yaml
          # No-op when the manifest already has this tag (first deploy).
          git diff --cached --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "deploy: play-api ${{ env.IMAGE_TAG }}"
          for i in $(seq 1 10); do
            git push && exit 0
            git pull --rebase
            sleep $((RANDOM % 5 + 3))
          done
          echo "::error::manifest push failed after 10 attempts"
          exit 1
